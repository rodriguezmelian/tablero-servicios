version: '3.8'

services:
  version-dashboard:
    build: .
    container_name: hub-version-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_KEY=
      - SMTP_USER=gabriel
      - SMTP_PASS=
      - SMTP_HOST=
      - SMTP_PORT=465
  nginx-provincia-test:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./version.json:/usr/share/nginx/html/version.json

volumes:
  dashboard_data: