server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Ruta principal de la aplicación de la sucursal
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint de Healthcheck dedicado para Uptime Kuma y Rancher
    location /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP","database":"connected","branch":"activa","timestamp":"$time_local"}';
    }

    # Endpoint adicional por si prefieres formato texto plano
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
